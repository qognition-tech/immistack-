<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1120" />
    <!-- Per-page title, description, canonical, Open Graph and schema are injected per route via the Seo component. -->
    <!-- Immistack Favicon (SVG Data URI) -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='18' width='6' height='12' rx='1' fill='%230B1120' opacity='0.8'/%3E%3Crect x='13' y='10' width='6' height='20' rx='1' fill='%230B1120' opacity='0.9'/%3E%3Crect x='22' y='2' width='6' height='28' rx='1' fill='%23B45309'/%3E%3C/svg%3E" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!--
      Tailwind is compiled at build time (tailwind.config.js + styles/index.css),
      imported from index.tsx. It used to load from cdn.tailwindcss.com, which
      shipped the whole JIT compiler to the browser on every page load,
      render-blocking and unpurged.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Sans+3:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
